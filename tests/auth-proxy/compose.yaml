services:
  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_DB: auth_proxy_test
      POSTGRES_PASSWORD: auth_proxy_test
      POSTGRES_USER: auth_proxy_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_proxy_test -d auth_proxy_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  auth:
    image: ${AUTH_IMAGE:?AUTH_IMAGE must be set}
    environment:
      AUTH_JWT_KEY_ID: auth-proxy-integration-test
      AUTH_JWT_PRIVATE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
      GRPC_PORT: "19091"
      GRPC_REFLECTION_ENABLED: "true"
      HTTP_PORT: "18081"
      POSTGRESDB_URI: postgres://auth_proxy_test:auth_proxy_test@postgres:5432/auth_proxy_test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  auth-proxy:
    image: ${AUTH_PROXY_IMAGE:?AUTH_PROXY_IMAGE must be set}
    environment:
      AUTH_GRPC_HOST: auth
      AUTH_GRPC_PORT: "19091"
      AUTH_JWKS_HOST: auth
      AUTH_JWKS_PORT: "18081"
      PROXY_PORT: "18080"
    depends_on:
      auth:
        condition: service_started
    ports:
      - "127.0.0.1::18080"

  grpcurl:
    image: fullstorydev/grpcurl:v1.9.3
    profiles: ["test"]
