version: "2"

linters:
  enable:
    - govet
    - revive
    - testifylint
    - depguard
    - gocognit
    - gocyclo
  exclusions:
    paths:
      - gen/
      - gen_*\.go
    rules:
      - path: _test\.go
        linters:
          - govet
          - revive
      # Allow only the existing diagnostic for each function, not later increases.
      - path: ^cmd/entrypoint/main\.go$
        linters: [gocognit]
        text: '^cognitive complexity 14 of func `runMigrator` is high \(> 10\)$'
      - path: ^cmd/server/main\.go$
        linters: [gocognit]
        text: '^cognitive complexity 13 of func `main` is high \(> 10\)$'
      - path: ^cmd/server/main\.go$
        linters: [gocyclo]
        text: '^cyclomatic complexity 12 of func `main` is high \(> 10\)$'
      - path: ^internal/secret/argon2id\.go$
        linters: [gocognit]
        text: '^cognitive complexity 22 of func `newArgon2IDPHCBuilderFromPHC` is high \(> 10\)$'
      - path: ^internal/secret/argon2id\.go$
        linters: [gocyclo]
        text: '^cyclomatic complexity 18 of func `newArgon2IDPHCBuilderFromPHC` is high \(> 10\)$'
  settings:
    gocognit:
      min-complexity: 10
    gocyclo:
      min-complexity: 10
    depguard:
      rules:
        appmock-test-only:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/air-hand-org/jobdeck-auth/internal/appmock
              desc: appmock may only be imported by test files
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - gen/
      - gen_*\.go
      - _test\.go
