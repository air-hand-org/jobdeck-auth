version: "2"

linters:
  enable:
    - govet
    - revive
    - testifylint
    - depguard
  exclusions:
    paths:
      - gen/
      - gen_*\.go
    rules:
      - path: _test\.go
        linters:
          - govet
          - revive
  settings:
    depguard:
      rules:
        appmock-test-only:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/air-hand-org/jobdeck-auth/internal/appmock
              desc: appmock may only be imported by test files
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - gen/
      - gen_*\.go
      - _test\.go
