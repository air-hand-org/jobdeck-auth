version: "2"
cloud:
    organization: ""
    project: ""
    hostname: ""
servers: []
sql:
  - engine: postgresql
    schema: "services/job-api/db/job/migrations"
    queries: "services/job-api/db/job/queries"
    gen:
      go:
        package: "jobdb"
        out: "services/job-api/internal/repository/gen"
        sql_package: "pgx/v5"
        emit_prepared_queries: true
        emit_interface: true
        emit_empty_slices: true
        rename:
          job_job_detail: Job
          job_execution_detail: Execution
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
  - engine: postgresql
    schema: "services/auth/internal/db/auth/migrations"
    queries: "services/auth/internal/db/auth/queries"
    gen:
      go:
        package: "authdb"
        out: "services/auth/internal/repository/gen"
        sql_package: "pgx/v5"
        emit_prepared_queries: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
overrides:
    go: null
plugins: []
rules: []
options: {}
