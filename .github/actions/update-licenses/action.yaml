name: Update generated licenses
description: Validate license-only changes, then push with a scoped App token and fail the old run.
inputs:
  eligible:
    description: Whether this is a same-repository Renovate pull request
    required: true
  expected-head:
    description: Pull request head SHA used for generation
    required: true
  head-branch:
    description: Same-repository pull request branch to update
    required: true
  repository:
    description: Repository name (without owner) for the push-only token
    required: true
  app-client-id:
    description: Push App client ID
    required: true
  app-private-key:
    description: Push App private key; used only after validation
    required: true
runs:
  using: composite
  steps:
    - name: Validate generated changes
      id: generated
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ELIGIBLE: ${{ inputs.eligible }}
        EXPECTED_HEAD: ${{ inputs.expected-head }}
      run: bash "$ACTION_PATH/validate.sh"
    - name: Create push-only App token
      if: steps.generated.outputs.push == 'true'
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        repositories: ${{ inputs.repository }}
        permission-contents: write
    - name: Push licenses and fail this run
      if: steps.generated.outputs.push == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        EXPECTED_HEAD: ${{ inputs.expected-head }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
      run: bash "$ACTION_PATH/push.sh"
