name: Deploy

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  images:
    if: ${{ github.event.release.prerelease == false }}
    uses: ./.github/workflows/_build-images.yaml
    with:
      push: true
      image_tag: ${{ github.event.release.tag_name }}
      environment: production
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  prepare-deploy:
    if: ${{ github.event.release.prerelease == false }}
    needs: images
    uses: air-hand-org/jobdeck-actions/.github/workflows/reusable-release-dispatch.yaml@043b9c976fcffb56f76fabb18b67e36295a51ae9 # v1.3.0
    with:
      service-names: auth
    secrets: inherit
