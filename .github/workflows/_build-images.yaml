name: Build images

on:
  workflow_call:
    inputs:
      push:
        description: Publish images to Artifact Registry and GHCR instead of only building them.
        required: false
        type: boolean
        default: false
      image_tag:
        description: Immutable image tag. Required when push is true.
        required: false
        type: string
        default: ""
      environment:
        description: GitHub environment containing GCP deployment variables.
        required: false
        type: string
        default: ""

concurrency:
  # CI build-only runs are disposable and share a group per ref. Publishing is
  # keyed by immutable release tag and must never be cancelled mid-push.
  group: build-images-${{ inputs.push && inputs.image_tag || github.ref }}
  cancel-in-progress: ${{ inputs.push == false }}

permissions: {}

jobs:
  build:
    # CI uses this path. It intentionally has neither a GitHub environment nor
    # OIDC permissions, so it cannot access GCP or push.
    if: ${{ inputs.push == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: create GitHub App token for read GOPRIVATE
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: |
            api-contracts
      - uses: docker/setup-buildx-action@v4
      - name: Build auth image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: jobdeck-auth:test
          secrets: |
            github_contents_token=${{ steps.app-token.outputs.token }}
      - name: Build auth proxy image
        uses: docker/build-push-action@v7
        with:
          context: ./containers/auth-proxy
          platforms: linux/amd64
          push: false
          load: true
          tags: jobdeck-auth-proxy:test
      - name: Test auth proxy routing
        env:
          AUTH_IMAGE: jobdeck-auth:test
          AUTH_PROXY_IMAGE: jobdeck-auth-proxy:test
        run: sh ./tests/auth-proxy/run.sh

  publish:
    if: ${{ inputs.push == true }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      ARTIFACT_REGISTRY_HOST: asia-northeast1-docker.pkg.dev
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: create GitHub App token for read GOPRIVATE
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: |
            api-contracts
      - uses: docker/setup-buildx-action@v4
      - name: Validate image tag
        run: test -n "$IMAGE_TAG"
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Artifact Registry accepts an OAuth access token as the Docker
          # password. This avoids configuring mutable Docker credential-helper
          # state with gcloud.
          token_format: access_token
      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}
      - name: Check whether auth image already exists
        id: image
        env:
          IMAGE: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-auth/auth:${{ env.IMAGE_TAG }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2> "$RUNNER_TEMP/ar-inspect-error"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists; reusing $IMAGE"
          elif grep -Eq 'manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN|: not found$' "$RUNNER_TEMP/ar-inspect-error"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/ar-inspect-error" >&2
            exit 1
          fi
      - name: Build and push auth image
        if: ${{ steps.image.outputs.exists != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-auth/auth:${{ env.IMAGE_TAG }}
          secrets: |
            github_contents_token=${{ steps.app-token.outputs.token }}
      - name: Check whether auth proxy image already exists
        id: proxy-image
        env:
          IMAGE: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-auth-proxy/auth-proxy:${{ env.IMAGE_TAG }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2> "$RUNNER_TEMP/ar-proxy-inspect-error"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists; reusing $IMAGE"
          elif grep -Eq 'manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN|: not found$' "$RUNNER_TEMP/ar-proxy-inspect-error"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/ar-proxy-inspect-error" >&2
            exit 1
          fi
      - name: Build and push auth proxy image
        if: ${{ steps.proxy-image.outputs.exists != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./containers/auth-proxy
          platforms: linux/amd64
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-auth-proxy/auth-proxy:${{ env.IMAGE_TAG }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Always check GHCR, including when a previous attempt already pushed to AR.
      - name: Copy auth image to GHCR if missing
        env:
          AR_IMAGE: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-auth/auth
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/jobdeck-auth
        run: |
          if docker buildx imagetools inspect "$GHCR_IMAGE:$IMAGE_TAG" > /dev/null 2> "$RUNNER_TEMP/ghcr-inspect-error"; then
            echo "Image already exists; reusing $GHCR_IMAGE:$IMAGE_TAG"
            exit 0
          elif ! grep -Eq 'manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN|: not found$' "$RUNNER_TEMP/ghcr-inspect-error"; then
            cat "$RUNNER_TEMP/ghcr-inspect-error" >&2
            exit 1
          fi

          digest=$(docker buildx imagetools inspect "$AR_IMAGE:$IMAGE_TAG" --format '{{json .Manifest}}' | jq -er '.digest')
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$GHCR_IMAGE:$IMAGE_TAG" \
            "$AR_IMAGE@$digest"
      - name: Copy auth proxy image to GHCR if missing
        env:
          AR_IMAGE: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-auth-proxy/auth-proxy
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/jobdeck-auth-proxy
        run: |
          if docker buildx imagetools inspect "$GHCR_IMAGE:$IMAGE_TAG" > /dev/null 2> "$RUNNER_TEMP/ghcr-proxy-inspect-error"; then
            echo "Image already exists; reusing $GHCR_IMAGE:$IMAGE_TAG"
            exit 0
          elif ! grep -Eq 'manifest unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN|: not found$' "$RUNNER_TEMP/ghcr-proxy-inspect-error"; then
            cat "$RUNNER_TEMP/ghcr-proxy-inspect-error" >&2
            exit 1
          fi

          digest=$(docker buildx imagetools inspect "$AR_IMAGE:$IMAGE_TAG" --format '{{json .Manifest}}' | jq -er '.digest')
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$GHCR_IMAGE:$IMAGE_TAG" \
            "$AR_IMAGE@$digest"
