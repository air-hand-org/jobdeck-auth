name: Build Pages artifact

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@5d5ae954d815d44bd28dbebd4c920773aed02c8d # v1.7.4
      - name: Build interactive schema ERD
        run: make schema-erd
      - name: Test and render coverage
        run: make coverage
      - name: Upload Pages archive
        uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        with:
          name: ${{ inputs.artifact-name }}
          path: pages
