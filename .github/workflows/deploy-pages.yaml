name: Deploy Pages

on:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    uses: $/.github/workflows/_pages.yaml
    permissions:
      contents: read
    with:
      artifact-name: github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: schema-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
